# ============================================================================
# MOI TRuong LAP TRINH — kich hoat bang cach `mvn spring-boot:run`
# (application.properties de spring.profiles.active=dev, va nhom `dev` keo
#  theo ho so `local` chua secret rieng may — file do gitignored).
#
# File nay commit duoc vi KHONG chua secret. Tuy bien nao thieu gia tri thi
# no lay tu bien moi truong cua may, khong hardcode o day.
#
# Tai sao flyway o day ma khong o `local`: `local` dung rieng may, an toan khi
# tat flyway vi luc deploy van con `dev`/`prod` khai bao. De `local` o day se
# khienden `dev` tat Flyway -> DB moi khong bao gio duoc tao bang.
# ============================================================================

# DB dev — mac dinh trung voi bien cua may de khong gay doạn giua chan.
# Khi ban tao DB dev rieng (Aiven thu 2 / MySQL trong Docker), chi can doi
# bien moi truong LAPTOPSHOP_DB_URL tro vao do.
spring.datasource.url=${LAPTOPSHOP_DB_URL}
spring.datasource.username=${DB_LAPTOPSHOP_USERNAME}
spring.datasource.password=${DB_LAPTOPSHOP_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Migration TU CHAY khi dev. Dac thu cua dev la DB lien tuc doi theo code;
# phat sinh DB trong tuong lai cung nho di qua day.
spring.flyway.enabled=true

# Log SQL de nhin lenh that khi chan thuat.
spring.jpa.show-sql=true
