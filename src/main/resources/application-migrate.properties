# ============================================================================
# HỒ SƠ MIGRATE — chuyên dụng để chạy Flyway rồi dừng.
#
# Kích hoạt:  mvnw spring-boot:run -Dspring-boot.run.profiles=migrate
#
# Tồn tại vì: base để `spring.flyway.enabled=false` (xem application.properties)
# nên không môi trường thường nào tự bắn migration lên DB dùng chung. Khi cần
# đổi cấu trúc DB THẬT thì phải gọi đích danh hồ sơ này.
#
# Khi nào CẦN: code đã có entity mới (V<n>__...sql) nhưng chưa được deploy →
# DB chưa có bảng, `ddl-auto=validate` sẽ chặn khởi động.
# Khi nào KHÔNG cần: dev tự migrate qua hồ sơ `dev`; và khi code đã chạy trên
# DB rồi thì schema đã ngang bằng code, không còn gì để migrate.
#
# Chạy xong thì tắt app và chạy lại hồ sơ thường — app boot đủ nhanh vì không
# phải migrate nữa.
# ============================================================================

spring.flyway.enabled=true

# Bật log SQL để thấy rõ câu lệnh Flyway/Hibernate dựng gì khi chẩn đoán.
spring.jpa.show-sql=true
