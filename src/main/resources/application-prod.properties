# ============================================================================
# MOI TRuong SAN XU — kich hoat bang bien moi truong SPRING_PROFILES_ACTIVE=prod
#
# KHONG CO `spring.profiles.group.prod=local` co y: `local` la file rieng may
# dev, bi gitignore, se khong ton tai tren server. Neu ke vao thi prod khoi dong
# that bai vi thieu file, hoac te hon: load secret cua may dev.
#
# MOI gia tri o day phai di qua bien moi truong. File nay khong duoc chua bat cu
# chuoi noi ket nao — no duoc commit.
#
# Chay migration: Flyway VAN TAT o day theo dung cach da chon. Luc deploy thi
# chay rieng mot buoc truoc khi khoi dong app:
#   mvn flyway:migrate -Dflyway.url=$LAPTOPSHOP_DB_URL ...
# Neu muon app tu migrate luc boot (don hon khi chua co CI/CD), doi
# flyway.enabled=true o day va chap nhan no chay moi lan cap nhat.
# ============================================================================

spring.datasource.url=${LAPTOPSHOP_DB_URL}
spring.datasource.username=${DB_LAPTOPSHOP_USERNAME}
spring.datasource.password=${DB_LAPTOPSHOP_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tuy doi bang du lieu: prod bat buoc co du lieu that.
spring.flyway.enabled=false

# Khong in SQL cau lenh ra log o san xu (noi chat chuot, lo nghien cuu du lieu).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server cong cong — container/Docker se dat gia tri cua no.
server.port=${SERVER_PORT:8080}

# Mail + thanh toan + luu tru anh: BAT BUOC phai co tren server, khong co mac
# dinh an toan. Thieu thi app chet ngay luc boot — tot hon la chay noi dung gia.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

jwt.signerKey=${SIGNER_KEY_LAP}
cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
# Khong doi dc: VnPay doi chieu chu ky theo thuat toan da chon tren portal cua ho.
vnpay.hash-type=hmacsha512
vnpay.url=${VNPAY_URL}
vnpay.version=2.1.0
vnpay.currency=VND
vnpay.locale=vn
vnpay.order-type=other
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.ipn-url=${VNPAY_IPN_URL}
vnpay.fe-return-url=${VNPAY_FE_RETURN_URL}
