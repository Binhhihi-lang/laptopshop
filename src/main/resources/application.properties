spring.application.name=laptopshop

# ============================================================================
# MOI TRUONG — mac dinh la `dev`
# ----------------------------------------------------------------------------
# Trien khai that KHONG dua vao gia tri mac dinh nay. Server/CI CD bien moi
# truong bang cach dat:   SPRING_PROFILES_ACTIVE=prod
# Bien moi truong duoc Spring doc VOI THU TIEN CAO HON file nay, nen ghi o day
# thanh `dev` van an toan khi da dat bien kia.
#
# Nhom `dev` keo theo ho so `local` (file application-local.properties,
# gitignored) chua secret rieng may dev: vnpay.tmn-code, mail...
# `prod` KHONG co nhom -> moi thu cua prod phai di qua bien moi truong.
# ============================================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.profiles.group.dev=local

# ============================================================================
# CAU TRUC DB — do Flyway nam, khong do Hibernate nua
# ----------------------------------------------------------------------------
# Tu day, moi thay doi bang/cot phai di qua file SQL trong
# src/main/resources/db/migration (V1, V2, V3...). Khong sua entity roi de
# Hibernate tu them cot nua — lam vay la bay matched giua entity va file SQL.
#
# Gia tri cu: spring.jpa.hibernate.ddl-auto=update
#   update cho phep Hibernate TU them/sua bang moi lan chay app, ke ca tren DB
#   production. Do chinh la lo hong lam `mvn test` sua duoc cau truc bang that
#   o Sprint 1 (test khong co profile tach rieng).
# Gia tri moi: validate — Hibernate chi DOI CHIEU entity voi bang that, khong
#   bao gio ghi. Lech kieu la app dung khoi dong, co loi ro rang thay vi im
#   tham doi bang.
# ============================================================================
spring.jpa.hibernate.ddl-auto=validate

# ---- Flyway: MAC DINH TAT ----
# Bat ky? so dong bang voi viec chon moi truong nao: DB Aiven o day dung chung cho
# ca lap trinh va chay that, neu de flyway.enabled=true thi moi lan minh
# `spring-boot:run` la mot migration chay thang len DB dang co nguoi dung.
# Muon chay migration -> danh tinh RONG, phai goi profile `migrate` (xem
# application-migrate.properties).
#
# LUU Y THU TU: vi day la `validate` chu khong phai `update`, mot DB TRONG hoan toan
# se KHONG khoi dong duoc (bao thieu bang). Must chay migrate TRUOC roi moi chay app:
#   1) mvnw spring-boot:run -Dspring-boot.run.profiles=migrate   # dung khi xong
#   2) mvnw spring-boot:run                                      # moi len duoc
spring.flyway.enabled=false
# baseline-on-migrate: DB Aiven Da co 15 bang san ma chua co bang flyway_schema_history.
# Cho phep Flyway "chap nhan" schema hien tai thay vi bao loi
# "non-empty schema without history table".
spring.flyway.baseline-on-migrate=true
# baseline o version 0 -> V1 van DUOC CHAY (khong phai bi an). Tren DB da co bang thi
# V1 chi la CREATE TABLE IF NOT EXISTS nen khong doi gi; tren DB trong thi V1 dung toan bo.
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# config database
spring.jpa.show-sql=true

# URL kết nối lên Cloud Aiven
spring.datasource.url=${LAPTOPSHOP_DB_URL}
spring.datasource.username=${DB_LAPTOPSHOP_USERNAME}
spring.datasource.password=${DB_LAPTOPSHOP_PASSWORD}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# config file upload

spring.servlet.multipart.max-file-size=100MB

# Tổng kích thước cả các trường và file

spring.servlet.multipart.max-request-size=100MB

# Tăng giới hạn cho cả request (bao gồm cả text/JSON body)

server.jetty.max-http-form-post-size=10MB

server.tomcat.max-http-form-post-size=10MB


# Việc này giúp hàm UploadService của bạn đọc trực tiếp đường dẫn này từ file cấu hình
# Dùng dấu gạch chéo / cho chuẩn đường dẫn Spring
# upload.directory=D:/Spring/laptopshop/uploads/
# SIGNER_KEY
jwt.signerKey=${SIGNER_KEY_LAP:}
jwt.valid-duration=21600
# Cấu hình redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.refreshable-duration=${JWT_REFRESHABLE_DURATION:864000}

# ==== Email (luồng quên mật khẩu cho khách hàng storefront) ====

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# (dong `spring.profiles.active=local` o day da chuyen len dau file — no cung
#  key voi dong tren thi key doc sau win, nen de lai thi moi truong dev bi vo hieu hoa)


# ==== Password reset ====
# Token hết hạn sau 1 giờ (đơn vị: phút). Có thể override qua env.
app.reset-password.token-validity-minutes=${RESET_TOKEN_VALIDITY_MINUTES:60}
# Link FE bấm vào sau khi mở mail. Mặc định trỏ tới trang /client/reset-password
# của Angular dev server, kèm query ?token=... để FE đọc rồi gọi API.
app.reset-password.base-url=${RESET_PASSWORD_BASE_URL:http://localhost:4200/reset-password}

# ==== Giới hạn thiết bị đăng nhập ====
# Số thiết bị tối đa cho mỗi CUSTOMER (ADMIN/STAFF được miễn). Mỗi thiết bị giữ
# đúng 1 phiên nên giá trị này cũng là số phiên tối đa.
# Test nhanh kịch bản vượt giới hạn: set DEVICE_MAX_SESSIONS=1
app.device.max-sessions=${DEVICE_MAX_SESSIONS:2}
# Hạn dùng của "revoke ticket" (đơn vị: giây) — vé tạm cấp khi login bị chặn vì
# vượt giới hạn, dùng để xác thực yêu cầu "đăng xuất thiết bị cũ nhất" mà không
# phải gửi lại mật khẩu. Dùng 1 lần rồi xóa.
app.device.revoke-ticket-ttl-seconds=${DEVICE_REVOKE_TICKET_TTL:300}

# ==== VNPay (cổng thanh toán storefront) ====
# Key nhận sau khi đăng ký https://sandbox.vnpayment.vn/devreg/ — đặt qua env
# hoặc ghi thật vào application-local.properties (file này đã gitignore).
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
# Thuật toán chữ ký. VNPay KHÔNG có tham số vnp_SecureHashType trong tài liệu:
# cổng verify theo thuật toán cấu hình trên portal nên phải khớp portal.
# Mọi code mẫu chính thức (PHP/Java/C#/NodeJS) đều ký HmacSHA512.
vnpay.hash-type=hmacsha512
# Sandbox; đổi sang endpoint production khi go live.
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.version=2.1.0
vnpay.currency=VND
vnpay.locale=vn
vnpay.order-type=other
# URL VNPay gọi tới: return (trình duyệt redirect), ipn (server VNPay gọi).
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/client/payments/vnpay/return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/v1/client/payments/vnpay/ipn}
# Nơi FE hiển thị kết quả sau khi VNPay redirect trình duyệt về /return.
vnpay.fe-return-url=${VNPAY_FE_RETURN_URL:http://localhost:4200/payment-result}