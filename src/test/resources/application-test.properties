# ============================================================================
# HỒ SƠ TEST — MỌI test đều dùng file này, KHÔNG dùng application.properties
# của môi trường thật.
#
# Lý do tồn tại: các test @SpringBootTest nạp toàn bộ Spring context, và context
# thì khởi tạo DataSource + Flyway. Trước khi có file này, src/test/resources
# không có gì nên test nối THẲNG vào DB Aiven production qua biến môi trường —
# chỉ cần chạy `mvn test` là có thể đổi cấu trúc bảng của hệ thống đang chạy
# thật. Đây chính là sự cố đã xảy ra ở Sprint 1.
#
# Cách kích hoạt: @ActiveProfiles("test") trên lớp test. Tên hồ sơ "test" khớp
# với application-test.properties nên Spring nạp file này ĐÈ lên
# application.properties (file chính vẫn được nạp trước, chỉ các key ghi ở đây
# bị ghi đè).
# ============================================================================

# ---- DB: H2 in-memory, tách hẳn MySQL production ----
# MODE=MySQL để H2 chấp nhận cú pháp SQL kiểu MySQL.
# DB_CLOSE_DELAY=-1 giữ DB sống suốt JVM, nên nhiều test class dùng chung được.
spring.datasource.url=jdbc:h2:mem:laptopshop_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- Cấu trúc bảng do Hibernate dựng, KHÔNG chạy Flyway ----
# Flyway tắt vì các file migration viết bằng SQL riêng của MySQL (enum, bit(1),
# datetime(6)) — H2 không hiểu hết. Test chỉ cần schema đúng theo Entity, nên
# để Hibernate dựng rồi đối chiếu bằng validate.
spring.flyway.enabled=false
# create-drop: dựng lại từ đầu cho mỗi lần chạy JVM → test không dirty-data lẫn nhau.
spring.jpa.hibernate.ddl-auto=create-drop
# Không khai báo dialect: Hibernate tự suy ra từ driver H2. Khai báo tay bị
# HHH90000025 cảnh báo là thừa.
spring.jpa.show-sql=false

# ---- Redis ----
# Spring Data Redis connect LAZY (chỉ mở khi có lệnh đầu tiên), nên bộ test hiện
# tại không cần Redis thật: chỉ LaptopshopApplicationTests nạp context và nó không
# đụng Redis. Nếu sau này thêm test nào gọi Redis (đăng nhập, thu hồi token...) thì
# phải thêm Redis in-memory, nếu không test sẽ fail vì refused connection chứ không
# fail vì logic.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---- Mail ----
# Host giả: test không gửi mail thật. Bind vào biến ở cuối file để
# JavaMailSender khởi tạo được mà không cần mạng.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

# ---- Các @Value bắt buộc (không có giá trị mặc định trong code) ----
# Đủ bộ để context nạp được mà không cần đọc biến môi trường của máy dev hay
# của CI. Giá trị là giả — chỉ phục vụ việc khởi tạo bean.
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret
jwt.signerKey=test-signer-key-only-for-tests-0123456789
jwt.valid-duration=21600
jwt.refreshable-duration=864000
app.device.max-sessions=2
app.device.revoke-ticket-ttl-seconds=300

# VNPay: hash-type bắt buộc phải là giá trị code nhận biết được
# ("hmacsha512" hoặc "sha256") — VnpayService.sign() ném IllegalStateException
# nếu lạ, và VnpayServiceTest đổi giá trị này ngay trong test.
vnpay.tmn-code=TESTTMN
vnpay.hash-secret=test-hash-secret
vnpay.hash-type=hmacsha512
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.version=2.1.0
vnpay.currency=VND
vnpay.locale=vn
vnpay.order-type=other
vnpay.return-url=http://localhost:8080/api/v1/client/payments/vnpay/return
vnpay.ipn-url=http://localhost:8080/api/v1/client/payments/vnpay/ipn
vnpay.fe-return-url=http://localhost:4200/payment-result
